name: Run Clarivance agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What should the agents do?"
        required: true
      agent:
        description: "Which agent to run"
        type: choice
        options: [coordinator, researcher, writer]
        default: coordinator
      post_issue:
        description: "Also post the result as a GitHub issue"
        type: boolean
        default: true
  # Uncomment to run a fixed task on a schedule (times are UTC):
  # schedule:
  #   - cron: "0 7 * * *"

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Task and agent come from the form, or these defaults for scheduled runs.
      TASK: ${{ inputs.task || 'Summarise the top AI news from the last 24 hours in 5 bullets, with sources.' }}
      AGENT: ${{ inputs.agent || 'coordinator' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Clarivance
        run: pip install -e .

      - name: Check API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add your Claude API key as a repository secret named ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: clarivance --agent "$AGENT" "$TASK" > result.md

      - name: Show result on the run page
        if: always() && hashFiles('result.md') != ''
        run: |
          {
            echo "## Task ($AGENT)"
            echo
            echo "$TASK"
            echo
            echo "## Result"
            echo
            cat result.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post result as an issue
        if: success() && (github.event_name == 'schedule' || inputs.post_issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Agent:** $AGENT"
            echo
            echo "**Task:** $TASK"
            echo
            echo "---"
            echo
            cat result.md
            echo
            echo "---"
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > issue.md
          title="Clarivance result: ${TASK:0:80}"
          gh issue create --title "$title" --body-file issue.md

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('result.md') != ''
        with:
          name: result
          path: result.md
